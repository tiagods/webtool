# Stack de produção na instância AWS Lightsail (ver deploy.md).
#
# Segredos e credenciais vêm de um .env NÃO versionado (interpolação abaixo),
# nunca em texto plano neste arquivo.
#
# Credenciais AWS: o Lightsail não suporta IAM role na instância, então api e
# worker usam access key de IAM users distintos (fichas-api/fichas-worker) — cada serviço
# recebe só a sua, para manter o menor privilégio. Sem AWS_ENDPOINT_URL, a cadeia
# padrão do SDK lê AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY do ambiente.
services:

  # ─── web — frontend Next.js (páginas, sem acesso a AWS) ────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: prolink-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}   # .env não versionado
    restart: unless-stopped

  # ─── api — backend Go (Echo + Clean Architecture, spec 022–028) ────────────
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        APP: api
    container_name: prolink-api
    ports:
      - "3001:3001"
    environment:
      APP_ENV: prod
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${API_AWS_ACCESS_KEY_ID:?API_AWS_ACCESS_KEY_ID é obrigatória}
      AWS_SECRET_ACCESS_KEY: ${API_AWS_SECRET_ACCESS_KEY:?API_AWS_SECRET_ACCESS_KEY é obrigatória}
      AWS_DYNAMODB_ABERTURA_TABLE: ${AWS_DYNAMODB_ABERTURA_TABLE:-FichasAbertura}
      AWS_DYNAMODB_ALTERACAO_TABLE: ${AWS_DYNAMODB_ALTERACAO_TABLE:-FichasAlteracao}
      AWS_DYNAMODB_ACEITES_TABLE: ${AWS_DYNAMODB_ACEITES_TABLE:-AceitesLgpd}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-prolink-fichas}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL}
      JWT_SECRET: ${JWT_SECRET}   # .env não versionado
      SESSION_EXPIRY_SECONDS: "7200"
    restart: unless-stopped

  # ─── worker — consumidor SQS (long-poll), geração de e-mail ────────────────
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        APP: worker
    container_name: prolink-worker
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET}   # .env não versionado
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${WORKER_AWS_ACCESS_KEY_ID:?WORKER_AWS_ACCESS_KEY_ID é obrigatória}
      AWS_SECRET_ACCESS_KEY: ${WORKER_AWS_SECRET_ACCESS_KEY:?WORKER_AWS_SECRET_ACCESS_KEY é obrigatória}
      AWS_DYNAMODB_ABERTURA_TABLE: ${AWS_DYNAMODB_ABERTURA_TABLE:-FichasAbertura}
      AWS_DYNAMODB_ALTERACAO_TABLE: ${AWS_DYNAMODB_ALTERACAO_TABLE:-FichasAlteracao}
      AWS_DYNAMODB_ACEITES_TABLE: ${AWS_DYNAMODB_ACEITES_TABLE:-AceitesLgpd}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-prolink-fichas}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST é obrigatória}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT é obrigatória}
      SMTP_USER: ${SMTP_USER:?SMTP_USER é obrigatória}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD é obrigatória}   # .env não versionado
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM é obrigatória}
      SMTP_TO: ${SMTP_TO:?SMTP_TO é obrigatória}
    restart: unless-stopped

  # ─── nginx — roteamento interno (web/api), sem exposição direta ─────────────
  # Porta 80 não é mais publicada no host: o Caddy é o único ponto de entrada
  # público (TLS termina no Caddy, que repassa para nginx:80 na rede interna).
  nginx:
    build:
      context: ./scripts/nginx
    container_name: prolink-nginx
    expose:
      - "80"
    depends_on:
      - web
      - api
    restart: unless-stopped

  # ─── caddy — ponto de entrada público (TLS automático via Let's Encrypt) ────
  caddy:
    image: caddy:2-alpine
    container_name: prolink-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
