services:

  # ─── Floci — emulador AWS local ────────────────────────────────────────────
  floci:
    image: floci/floci:latest
    container_name: prolink-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_floci/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  # ─── aws-init — provisiona recursos após o Floci estar saudável ────────────
  aws-init:
    image: amazon/aws-cli:latest
    container_name: prolink-aws-init
    depends_on:
      floci:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./infra/local/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  # ─── web — frontend Next.js (páginas, sem acesso a AWS) ────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: prolink-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    restart: unless-stopped

  # ─── api — backend Next.js (Route Handlers + acesso a AWS) ──────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prolink-api
    ports:
      - "3001:3001"
    depends_on:
      floci:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DYNAMODB_TABLE: fichas-abertura
      AWS_DYNAMODB_ALTERACAO_TABLE: fichas-alteracao
      AWS_S3_BUCKET: prolink-fichas
      AWS_SQS_QUEUE_URL: http://floci:4566/000000000000/prolink-abertura
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:prolink-abertura-emails
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      SESSION_EXPIRY_SECONDS: "7200"
    restart: unless-stopped

  # ─── nginx — ponto de entrada público (porta 80) ────────────────────────────
  nginx:
    build:
      context: ./infra/nginx
    container_name: prolink-nginx
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    restart: unless-stopped
