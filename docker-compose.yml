services:

  # ─── Floci — emulador AWS local ────────────────────────────────────────────
  floci:
    image: floci/floci:latest
    container_name: prolink-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s
    restart: unless-stopped
    
  floci-ui:
    image: floci/floci-ui:latest
    container_name: floci_ui
    ports:
      - "4500:4500"  # Interface Web
      - "4501:4501"  # API interna que o frontend consome
    environment:
      - VITE_MOCK_MODE=false
      - VITE_API_URL=http://localhost:4501
      - FLOCI_ENDPOINT=http://floci:4566
    depends_on:
      floci:
        condition: service_healthy
  # ─── aws-init — provisiona recursos após o Floci estar saudável ────────────
  aws-init:
    image: hashicorp/terraform:1.9.8
    container_name: prolink-aws-init
    depends_on:
      floci:
        condition: service_healthy
    working_dir: /terraform/local
    environment:
      TF_IN_AUTOMATION: "true"
      TF_VAR_endpoint_url: http://floci:4566
    volumes:
      - ./scripts/terraform:/terraform
    entrypoint: ["sh", "-c", "terraform init -input=false && terraform apply -auto-approve -input=false"]
    restart: "no"

  # ─── web — frontend Next.js (páginas, sem acesso a AWS) ────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: prolink-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    restart: unless-stopped

  # ─── api — backend Go (Echo + Clean Architecture, spec 022–028) ─────────────
  # Não exposto publicamente em produção; o nginx roteia /api/* para api:3001.
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        APP: api
    container_name: prolink-api
    ports:
      - "3001:3001"
    depends_on:
      floci:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      SESSION_EXPIRY_SECONDS: "7200"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DYNAMODB_ABERTURA_TABLE: FichasAbertura
      AWS_DYNAMODB_ALTERACAO_TABLE: FichasAlteracao
      AWS_DYNAMODB_ACEITES_TABLE: AceitesLgpd
      AWS_S3_BUCKET: prolink-fichas
      AWS_SQS_QUEUE_URL: http://floci:4566/000000000000/FichasSubmissoes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # ─── worker — consumidor SQS (long-poll), geração de e-mail ────────────────
  # Usa o mesmo binário Go do módulo apps/backend, selecionado por build arg.
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        APP: worker
    container_name: prolink-worker
    depends_on:
      floci:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DYNAMODB_ABERTURA_TABLE: FichasAbertura
      AWS_DYNAMODB_ALTERACAO_TABLE: FichasAlteracao
      AWS_DYNAMODB_ACEITES_TABLE: AceitesLgpd
      AWS_S3_BUCKET: prolink-fichas
      AWS_SQS_QUEUE_URL: http://floci:4566/000000000000/FichasSubmissoes
      # Opcionais em dev: sem SMTP_HOST o worker cai no fallback de arquivo
      # (HTML em /tmp dentro do container — spec 035).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TO: ${SMTP_TO}
    restart: unless-stopped
  # ─── nginx — ponto de entrada público (porta 80) ────────────────────────────
  nginx:
    build:
      context: ./scripts/nginx
    container_name: prolink-nginx
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    restart: unless-stopped
