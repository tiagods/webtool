services:

  # ─── Floci — emulador AWS local ────────────────────────────────────────────
  floci:
    image: floci/floci:latest
    container_name: prolink-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_floci/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  # ─── aws-init — provisiona recursos após o Floci estar saudável ────────────
  aws-init:
    image: amazon/aws-cli:latest
    container_name: prolink-aws-init
    depends_on:
      floci:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./infra/local/init.sh:/init.sh:ro
      # Fonte única dos parâmetros estruturais (spec 021) — init.sh faz source.
      - ./infra/aws/lib/params.sh:/params.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  # ─── web — frontend Next.js (páginas, sem acesso a AWS) ────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: prolink-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    restart: unless-stopped

  # ─── api — backend Go (Echo + Clean Architecture, spec 022–028) ─────────────
  # Não exposto publicamente em produção; o nginx roteia /api/* para api:3001.
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        APP: api
    container_name: prolink-api
    ports:
      - "3001:3001"
    depends_on:
      floci:
        condition: service_healthy
    environment:
      APP_ENV: dev
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      SESSION_EXPIRY_SECONDS: "7200"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DYNAMODB_TABLE: fichas-abertura
      AWS_DYNAMODB_ALTERACAO_TABLE: fichas-alteracao
      AWS_DYNAMODB_ACEITES_TABLE: prolink-aceites-lgpd
      AWS_S3_BUCKET: prolink-fichas
      AWS_SQS_QUEUE_URL: http://floci:4566/000000000000/prolink-abertura
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

# ─── worker — consumidor SQS (long-poll), geração de e-mail ────────────────
  # Usa o mesmo binário Go do módulo apps/backend, selecionado por build arg.
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        APP: worker
    container_name: prolink-worker
    depends_on:
      floci:
        condition: service_healthy
    environment:
      APP_ENV: dev
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DYNAMODB_TABLE: fichas-abertura
      AWS_DYNAMODB_ALTERACAO_TABLE: fichas-alteracao
      AWS_DYNAMODB_ACEITES_TABLE: prolink-aceites-lgpd
      AWS_S3_BUCKET: prolink-fichas
      AWS_SQS_QUEUE_URL: http://floci:4566/000000000000/prolink-abertura
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST é obrigatória}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT é obrigatória}
      SMTP_USER: ${SMTP_USER:?SMTP_USER é obrigatória}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD é obrigatória}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM é obrigatória}
      SMTP_TO: ${SMTP_TO:?SMTP_TO é obrigatória}
    restart: unless-stopped
  # ─── nginx — ponto de entrada público (porta 80) ────────────────────────────
  nginx:
    build:
      context: ./infra/nginx
    container_name: prolink-nginx
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    restart: unless-stopped
